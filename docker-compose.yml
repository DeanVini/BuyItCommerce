services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=BuyItCommerce;User Id=sa;Password=${SA_PASSWORD:-Your_password123};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__MongoDb: "mongodb://mongo:27017"
      Mongo__Database: "buyitcommerce"
      Outbox__PollingIntervalSeconds: "5"
      Idempotency__KeyExpirationHours: "24"
      Cache__ListingTtlSeconds: "30"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Your_password123}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql

  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mongo-data:/data/db

volumes:
  sqlserver-data:
  mongo-data:
